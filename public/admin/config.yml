# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Admin panel for the portfolio: https://ratheeshk2505.github.io/portfolio/admin/
# Every save is a commit to `develop`, which triggers the GitHub Pages deploy.
# Only GitHub accounts with write access to the repo can sign in.

backend:
  name: github
  repo: ratheeshk2505/portfolio
  branch: develop
  # Sign in with a fine-grained GitHub token (Contents: read & write on this repo only).
  # To get a "Sign In with GitHub" button instead, deploy sveltia-cms-auth on
  # Cloudflare Workers, then add `base_url: <worker URL>` and `oauth` below.
  auth_methods: [token]
  commit_messages:
    create: "content: add {{collection}} “{{slug}}”"
    update: "content: update {{collection}} “{{slug}}”"
    delete: "content: delete {{collection}} “{{slug}}”"
    uploadMedia: "content: upload “{{path}}”"
    deleteMedia: "content: delete “{{path}}”"

site_url: https://ratheeshk2505.github.io/portfolio/
display_url: https://ratheeshk2505.github.io/portfolio/

# Uploaded images go to public/images and are referenced as /images/<file>.
media_folder: /public/images
public_folder: /images

collections:
  - name: settings
    label: Profile
    icon: person
    files:
      - name: site
        label: Site design
        file: /src/content/site.json
        fields:
          - name: template
            label: Template
            widget: select
            default: classic
            hint: >-
              Classic: warm serif with 3D cards. Minimal: clean, centered, blue accent.
              Terminal: developer look with a code-window hero. Preview any of them before
              saving by adding ?template=minimal (or classic / terminal) to the site URL.
            options:
              - { label: Classic, value: classic }
              - { label: Minimal, value: minimal }
              - { label: Terminal, value: terminal }
      - name: profile
        label: Profile & Contact
        file: /src/content/profile.json
        fields:
          - { name: name, label: Name }
          - { name: role, label: Job title, hint: "Shown in the page title and link previews." }
          - name: seoDescription
            label: Search & share description
            widget: text
            hint: "One or two sentences shown on Google and in LinkedIn/WhatsApp previews."
          - { name: skillsSummary, label: Title-bar skills, hint: "e.g. Angular, React, NestJS" }
          - { name: greeting, label: Hero greeting }
          - { name: heroIntro, label: Hero introduction, widget: text }
          - name: heroDetails
            label: Hero detail lines
            widget: list
            field: { name: line, label: Line }
          - { name: heroBadge, label: Photo card caption, required: false }
          - { name: photo, label: Photo, widget: image, required: false }
          - name: about
            label: About paragraphs
            widget: list
            field: { name: paragraph, label: Paragraph, widget: text }
          - name: strengths
            label: Strengths
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title }
              - { name: detail, label: Detail, widget: text }
          - { name: contactIntro, label: Contact section intro, widget: text }
          - { name: email, label: Email }
          - { name: linkedin, label: LinkedIn URL, required: false }
          - { name: github, label: GitHub URL, required: false }
          - { name: location, label: Location, required: false }

  - name: experience
    label: Experience
    label_singular: Job
    icon: work
    file: /src/content/experience.json
    identifier_field: company
    summary: "{{role}} · {{company}}"
    fields:
      - { name: company, label: Company }
      - { name: role, label: Role }
      - { name: duration, label: Duration, hint: "e.g. Dec 2021 — Aug 2025, or July 2026 — Present" }
      - { name: location, label: Location / work mode }
      - { name: description, label: Summary, widget: text }
      - name: achievements
        label: Achievements
        widget: list
        required: false
        field: { name: achievement, label: Achievement, widget: text }

  - name: projects
    label: Projects
    label_singular: Project
    icon: folder
    file: /src/content/projects.json
    identifier_field: title
    fields:
      - { name: title, label: Title }
      - { name: description, label: Description, widget: text }
      - name: technologies
        label: Technologies
        widget: list
        field: { name: technology, label: Technology }
      - { name: github, label: Source code URL, required: false }
      - { name: demo, label: Live demo URL, required: false }

  - name: skills
    label: Skills
    label_singular: Skill group
    icon: psychology
    file: /src/content/skills.json
    identifier_field: category
    fields:
      - { name: category, label: Category }
      - name: items
        label: Skills
        widget: list
        field: { name: skill, label: Skill }
