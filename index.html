<!doctype html>
<html lang="en" data-template="%%TEMPLATE%%">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="%%PHOTO_PATH%%" />
    <link rel="canonical" href="https://ratheeshk2505.github.io/portfolio/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="%%SEO_DESCRIPTION%%" />
    <meta name="keywords" content="Software Engineer, Angular Developer, React Developer, React Native, NestJS, Frontend Development, Web Development, Full Stack, TypeScript, RxJS" />
    <meta name="author" content="%%NAME%%" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10131a" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%%NAME%% — %%ROLE%%" />
    <meta property="og:description" content="%%SEO_DESCRIPTION%%" />
    <meta property="og:image" content="%%PHOTO_URL%%" />
    <meta property="og:image:alt" content="%%NAME%% - %%ROLE%%" />
    <meta property="og:url" content="https://ratheeshk2505.github.io/portfolio/" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="%%NAME%% — %%ROLE%%" />
    <meta name="twitter:description" content="%%SEO_DESCRIPTION%%" />
    <meta name="twitter:image" content="%%PHOTO_URL%%" />
    <meta name="twitter:image:alt" content="%%NAME%% - %%ROLE%%" />

    <title>%%NAME%% — %%ROLE%% | %%SKILLS_SUMMARY%%</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Structured data (Person + WebSite) is generated from src/content at build time -->
    %%STRUCTURED_DATA%%

    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem("portfolio-theme"); } catch (e) {}
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = stored === "light" || stored === "dark" ? stored : prefersDark ? "dark" : "light";
        if (theme === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
